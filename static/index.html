<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Store</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🛒 Grocery Store</h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Search products…">
      <select id="category"><option value="">All categories</option></select>
    </div>
  </header>

  <main>
    <section id="products" class="grid"></section>

    <aside id="cart">
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p class="total">Total: ₹<span id="cart-total">0.00</span></p>
      <input id="customer" placeholder="Your name">
      <button id="checkout">Place Order</button>
      <p id="message"></p>
    </aside>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
